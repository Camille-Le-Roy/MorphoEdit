{% assign lang = "en" %}
{% if page.url contains '/fr/' %}
  {% assign lang = "fr" %}
{% endif %}
{% assign t = site.data.locales[lang] %}

<section id="testimonials" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="margin-bottom: 70px;">{{ t.testimonials.heading }}</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6 text-center">
                <div class="team-member" style="margin-bottom: 50px;">
                    <i class="fa fa-quote-left fa-2x" style="color: #3F6E93; margin-bottom: 20px;"></i>
                    
                    <p class="large" style="font-style: italic; color: #333; font-size: 18px; padding: 0 20px;">
                        "{{ t.testimonials.t1.quote }}"
                    </p>
                    <h4 style="margin-top: 15px; font-weight: 700;">— {{ t.testimonials.t1.name }}</h4>
                </div>
            </div>

            <div class="col-sm-6 text-center">
                <div class="team-member" style="margin-bottom: 50px;">
                    <i class="fa fa-quote-left fa-2x" style="color: #3F6E93; margin-bottom: 20px;"></i>
                    
                    <p class="large" style="font-style: italic; color: #333; font-size: 18px; padding: 0 20px;">
                        "{{ t.testimonials.t2.quote }}"
                    </p>
                    <h4 style="margin-top: 15px; font-weight: 700;">— {{ t.testimonials.t2.name }}</h4>
                </div>
            </div>
        </div>
    </div>
</section>
