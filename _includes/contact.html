<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="margin-bottom: 50px;">Reach Out<br></h2>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <div id="success" data-fs-success style="display:none; color: #3F6E93; font-weight: bold; margin-bottom: 20px;" class="text-center">
                    Thank you! Your message has been sent. I will get back to you shortly.
                </div>
                <div id="error" data-fs-error style="display:none; color: #d9534f; font-weight: bold; margin-bottom: 20px;" class="text-center">
                    Oops! There was a problem submitting your form. Please try again.
                </div>

                <form id="contactForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" name="name" class="form-control" placeholder="Your Name *" id="name" required data-fs-field style="height: 108px; margin-bottom: 20px;">
                                <span data-fs-error="name" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" name="email" class="form-control" placeholder="Your Email *" id="email" required data-fs-field style="height: 108px;">
                                <span data-fs-error="email" class="text-danger"></span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea name="message" class="form-control" placeholder="Your Message *" id="message" required data-fs-field style="height: 236px;"></textarea>
                                <span data-fs-error="message" class="text-danger"></span>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <button type="submit" class="btn btn-xl" data-fs-submit-btn>Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { 
    formElement: '#contactForm', 
    formId: 'xnjljlnq' 
  });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
