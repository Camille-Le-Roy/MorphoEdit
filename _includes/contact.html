{% assign lang = "en" %}
{% if page.url contains '/fr/' %}
  {% assign lang = "fr" %}
{% endif %}
{% assign t = site.data.locales[lang] %}

<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="margin-bottom: 50px;">{{ t.contact.heading }}</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <div id="success" data-fs-success style="color: #3F6E93; margin-bottom: 50px;" class="text-center">
                    <h3>{{ t.contact.success_title }}</h3>
                    <p class="large">{{ t.contact.success_msg }}</p>
                </div>

                <div id="error" data-fs-error style="color: #d9534f; font-weight: bold; margin-bottom: 20px;" class="text-center">
                    <p>{{ t.contact.error_msg }}</p>
                </div>

                <form id="contactForm" novalidate>
                    <div class="row" style="display: flex; flex-wrap: wrap;">
                        
                        <!-- LEFT COLUMN: Contact Details -->
                        <div class="col-md-6" style="display: flex; flex-direction: column; justify-content: space-between;">
                            <div class="control-group form-group">
                                <input type="text" name="name" class="form-control" placeholder="{{ t.contact.name_placeholder }}" id="name" required data-fs-field style="min-height: 80px; margin-bottom: 20px; width: 100%;">
                                <span data-fs-error="name" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" name="email" class="form-control" placeholder="{{ t.contact.email_placeholder }}" id="email" required data-fs-field style="min-height: 80px; margin-bottom: 20px; width: 100%;">
                                <span data-fs-error="email" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group" style="margin-bottom: 20px;">
                                <input type="text" name="referral" class="form-control" placeholder="{{ t.contact.referral_placeholder }}" id="referral" data-fs-field style="min-height: 80px; width: 100%;">
                            </div>
                        </div>
                        
                        <!-- RIGHT COLUMN: Service Selection Checkboxes (Stretched Vertically) -->
                        <div class="col-md-6" style="display: flex; flex-direction: column;">
                            <div class="form-group service-selection-container" style="margin-bottom: 20px; background: #f9fbfd; padding: 20px 24px; border-radius: 8px; border: 1px solid #e2e8f0; width: 100%; height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
                                <label style="font-weight: 700; margin-bottom: 12px; display: block; color: #333; font-size: 15px;">
                                    {{ t.contact.services_label }}
                                </label>
                                
                                <div class="checkbox-grid">
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="clarity" id="service-clarity">
                                        <span>{{ t.contact.options.clarity }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="accelerator" id="service-accelerator">
                                        <span>{{ t.contact.options.accelerator }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="dev_editing" id="service-dev_editing">
                                        <span>{{ t.contact.options.dev_editing }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="copy_editing" id="service-copy_editing">
                                        <span>{{ t.contact.options.copy_editing }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="manuscript_eval" id="service-manuscript_eval">
                                        <span>{{ t.contact.options.manuscript_eval }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="other" id="service-other">
                                        <span>{{ t.contact.options.other }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- FULL WIDTH BOTTOM ROW: Message Textarea (Added margin-top for extra gap) -->
                        <div class="col-lg-12 col-md-12" style="margin-top: 25px;">
                            <div class="control-group form-group" style="margin-bottom: 20px; width: 100%;">
                                <textarea name="message" class="form-control" placeholder="{{ t.contact.message_placeholder }}" id="message" required data-fs-field style="width: 100%; min-height: 180px; box-sizing: border-box; resize: vertical;"></textarea>
                                <span data-fs-error="message" class="text-danger"></span>
                            </div>
                        </div>
                        
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center" style="margin-top: 10px;">
                            <button type="submit" class="btn btn-xl" data-fs-submit-btn>{{ t.contact.submit_btn }}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Custom Styling for Contact Page Checkboxes -->
<style>
    /* 2 Columns of 3 lines grid stretching across container space */
    .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        column-gap: 15px;
        row-gap: 10px;
        flex: 1;
        align-content: space-evenly; /* Even vertical distribution */
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        color: #4a5568;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 0;
        padding: 6px 8px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    .checkbox-item:hover {
        background-color: #edf2f7;
    }

    .checkbox-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #3F6E93;
        cursor: pointer;
        margin: 0;
        flex-shrink: 0;
    }

    /* Collapse to 1 column on smaller mobile screens */
    @media (max-width: 480px) {
        .checkbox-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<!-- Formspree Scripts -->
<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { 
    formElement: '#contactForm', 
    formId: 'xnjljlnq' 
  });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>

<!-- Global Event Delegation Script -->
<script>
(function() {
    function handleServiceCheck(btn) {
        const serviceKey = btn.getAttribute('data-service');
        if (!serviceKey) return;
        
        const targetCheckbox = document.getElementById('service-' + serviceKey);
        if (targetCheckbox) {
            targetCheckbox.checked = true;
            
            // Trigger visual highlight feedback
            const parentLabel = targetCheckbox.closest('.checkbox-item');
            if (parentLabel) {
                parentLabel.style.backgroundColor = '#dbeafe';
                setTimeout(function() {
                    parentLabel.style.backgroundColor = 'transparent';
                }, 1500);
            }
        }
    }

    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-request-service');
        if (btn) {
            handleServiceCheck(btn);
        }
    }, true);
})();
</script>
