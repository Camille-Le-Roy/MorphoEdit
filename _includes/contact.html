{% assign lang = "en" %}
{% if page.url contains '/fr/' %}
  {% assign lang = "fr" %}
{% endif %}
{% assign t = site.data.locales[lang] %}

<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="margin-bottom: 50px;">{{ t.contact.heading }}</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <div id="success" data-fs-success style="color: #3F6E93; margin-bottom: 50px;" class="text-center">
                    <h3>{{ t.contact.success_title }}</h3>
                    <p class="large">{{ t.contact.success_msg }}</p>
                </div>

                <div id="error" data-fs-error style="color: #d9534f; font-weight: bold; margin-bottom: 20px;" class="text-center">
                    <p>{{ t.contact.error_msg }}</p>
                </div>

                <form id="contactForm" novalidate>
                    <div class="row" style="display: flex; flex-wrap: wrap;">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" name="name" class="form-control" placeholder="{{ t.contact.name_placeholder }}" id="name" required data-fs-field style="min-height: 120px; margin-bottom: 20px;">
                                <span data-fs-error="name" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" name="email" class="form-control" placeholder="{{ t.contact.email_placeholder }}" id="email" required data-fs-field style="min-height: 120px; margin-bottom: 20px;">
                                <span data-fs-error="email" class="text-danger"></span>
                            </div>
                        </div>
                        
                        <div class="col-md-6" style="display: flex; flex-direction: column;">
                            <div class="control-group form-group" style="flex: 1;">
                                <textarea name="message" class="form-control" placeholder="{{ t.contact.message_placeholder }}" id="message" required data-fs-field style="height: 100%; margin-bottom: 20px;"></textarea>
                                <span data-fs-error="message" class="text-danger"></span>
                            </div>
                        </div>
                        
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <button type="submit" class="btn btn-xl" data-fs-submit-btn>{{ t.contact.submit_btn }}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { 
    formElement: '#contactForm', 
    formId: 'xnjljlnq' 
  });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
