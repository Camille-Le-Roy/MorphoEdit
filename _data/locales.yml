  header:
    heading: "Your Research, Reshaped."
    lead_in: "Turn your scientific writings into clear, compelling narratives."
    btn: "Get Started"
  help_box:
    title: "I can help you if you are:"
    items:
      - "Thriving in the lab and the data, but transforming your results into a cohesive narrative feels like a daunting hurdle."
      - "Reaching the 'final mile' of your dissertation and need expert eyes to ensure your formatting, syntax, and scientific clarity are flawless."
      - "Looking to elevate your manuscript to achieve a high-impact, narrative-driven publication."
  about:
    heading: "About Me"
    name: "Camille Le Roy, PhD"
    intro: "Hi, I’m Camille. I am a research scientist, a field biologist, and a biomechanicist — but above all, I am a writer who understands the challenges of an academic career."
    details_1: "With a PhD in Evolutionary Biology from the University of Paris and over seven years of interdisciplinary research spanning Ecology and Biophysics, my journey has taken me from the cloud forests of Peru to labs in France and the Netherlands. Along the way, I came to realize a shared struggle among researchers: we excel at the 'doing' the experiments, the models, the field expeditions, but we often struggle to hit the 'stop button' and immerse ourselves in the writing."
    details_2: "I’ve been on that road. I know that turning years of messy data into a compelling story is a long, eventful adventure. Having authored 8 first-author papers in top-tier journals (including <em>Science</em> and <em>Nature Communications</em>) and served as a reviewer for 12+ multidisciplinary journals, I’ve learned how to bridge the gap between raw results and impactful publication."
    conclusion: "Today, I dedicate my expertise to helping fellow scholars navigate that 'final mile' and transform their research into narratives that truly do justice to their discoveries."

fr:
  nav:
    services: "Services"
    about: "À propos"
    testimonials: "Témoignages"
