  header:
    heading: "Votre Recherche, Repensée."
    lead_in: "Transformez vos écrits scientifiques en récits clairs et percutants."
    btn: "Commencer"
  help_box:
    title: "Je peux vous aider si vous :"
    items:
      - "Excellez en laboratoire et dans l'analyse de données, mais transformer vos résultats en un récit cohérent semble être un obstacle de taille."
      - "Arrivez au bout de votre thèse et avez besoin d'un regard expert pour garantir une syntaxe et une clarté scientifique irréprochables."
      - "Souhaitez sublimer votre manuscrit pour viser une publication à fort impact axée sur la narration."
  about:
    heading: "À propos"
    name: "Camille Le Roy, PhD"
    intro: "Bonjour, je suis Camille. Je suis chercheur, biologiste et biomécanicien — mais avant tout, je suis un rédacteur qui comprend les défis d'une carrière universitaire."
    details_1: "Titulaire d'un doctorat en biologie évolutive de l'Université de Paris et forte de plus de sept ans de recherche interdisciplinaire entre l'écologie et la biophysique, mon parcours m'a menée des forêts de nuages du Pérou aux laboratoires en France et aux Pays-Bas. En chemin, j'ai pris conscience d'une difficulté commune aux chercheurs : nous excellons dans la 'pratique' — les expériences, les modèles, les expéditions sur le terrain — mais nous avons souvent du mal à 'appuyer sur le bouton stop' pour nous immerger dans l'écriture."
    details_2: "Je suis passé par là. Je sais que transformer des années de données brutes en un récit captivant est une longue aventure. Avec 8 articles en premier auteur dans des revues de haut niveau (notamment <em>Science</em> et <em>Nature Communications</em>) et une expérience de relecture pour plus de 12 revues multidisciplinaires, j'ai appris à combler le fossé entre les résultats bruts et la publication marquante."
    conclusion: "Aujourd'hui, je consacre mon expertise à aider mes collègues chercheurs à franchir ce 'dernier kilomètre' et à transformer leurs recherches en récits qui rendent véritablement justice à leurs découvertes."