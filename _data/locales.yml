en:
  nav:
    services: "Services"
    about: "About"
    testimonials: "Testimonials"
    contact: "Contact"

  header:
    heading_part1: "<strong>You've done<br>the hard work</strong>"
    heading_part2: "Getting it published shouldn't<br>be the part that breaks you"
    lead_in: "Coaching and editing for early-career scientists who want steady guidance, personalized feedback, and a clear path from messy data to published papers"
    schedule_btn: "Book a Free Call"
    btn: "Message Me"

  empathy:
    headline: "You spent months in the lab or in the field, running experiments and debugging analyses. Every data point cost time, effort, and sweat. You've <em>earned</em> your results."
    sub-heading: "The tricky part isn’t the science anymore, it’s shaping your work into a clear, publishable story."
    text_1: "Research is messy by nature: iterative, nonlinear, full of dead ends and unexpected turns. But papers are expected to unfold like a perfect story. <strong style='color: #333;'>Telling that story is a real challenge, and it has nothing to do with the quality of your science.</strong>"
    text_3: "Supervisor’s time is often stretched across many responsibilities. As a result, most of the PhD journey happens between meetings, when you're <strong style='color: #333;'>left navigating uncertainty on your own</strong> and trying to decide where your time and energy are best spent."
    text_4: "<strong style='color: #333;'>Losing momentum and excitement</strong> for your own research is common during a PhD. Constantly feeling behind, being stuck on the same draft for weeks, and carrying the weight of uncertainty <strong style='color: #333;'>shouldn't be the price of becoming a researcher.</strong>"
    text_5: "<strong style='color: #333;'>I've been there</strong>. I know what it's like to have solid results but a manuscript that doesn’t read like it. A narrative pulling in five different directions. Nights spent staring at my own draft, <strong style='color: #333;'>wondering what the paper was even about.</strong>"
    text_6: "After years of turning research projects into publications and helping students do the same, I know how challenging the journey can be, and <strong style='color: #333;'>how much easier it becomes with the right guidance.</strong>"
    text_7: "What if you could submit within few months, and feel the relief of moving on to your next, more exciting project?"
    list_title: "What's it like to work with me?"
    bullet_1: "<strong>A fellow scientist who speaks your language.</strong> I've done the research, collected the data, revised, and published—I know how hard it is to publish a paper from start to finish."
    bullet_2: "<strong>No judgment.</strong> A draft is never too messy, and no question is too basic. Bring me the chaos."
    bullet_3: "<strong>Genuinely available.</strong> I won't vanish after sending tracked changes. Whether you need a full manuscript overhaul or just someone to think out loud with, I'm here."
    bullet_4: "<strong>Feedback specific to your work.</strong> I take the time to understand your research, your argument, and where you want to go. I don't give generic feedback."
    final_thought: "A manuscript shouldn't sit in a drafts folder for another six months. Your results matter—and the world can only build on work it can actually read. I built Morpho Editing because great science deserves to be told well. Let's make sure yours is."
    get_started_btn: "See My Services"
  
  coaching:
    heading: "Coaching Services"
    subheading: "Get a dedicated research partner in your corner"
    clarity:
      badge: "One-off"
      title: "Research Clarity Session"
      desc: "A single coaching session to help you address a specific challenge. Whether you're stuck on your manuscript, facing an upcoming deadline, or simply need clarity on your next steps, you'll leave with professional guidance and a clear way forward."
      points:
        pt1: "One 60-minute session"
        pt2: "Pre-session review of your materials"
        pt3: "Follow-up check-in to maintain momentum"
    accelerator:
      badge: "Ongoing"
      title: "Publication Accelerator"
      desc: "This ongoing coaching program gives you a dedicated partner to help you build momentum, strengthen your manuscript, and confidently move toward publication."
      points:
        pt1: "Two 60-minute online coaching sessions per month"
        pt2: "Draft review before each session"
        pt3: "Unlimited support via messaging"
        pt4: "Exclusive rates on editing services"

  services:
    heading: "Editing Services"
    subheading_main: "Get the right level of support for your manuscript"
    subheading_evaluation: "Feeling stuck but want to revise yourself?<br>Get a manuscript evaluation"
    subheading_figures: "Want your research to stand out at a glance?<br>Make an impact with publication-ready figures"
    subheading_cta: "Not sure what you need? Let's chat"
    checklist_title: "Right for you if:"
    btn: "Message Me"

    dev_editing:
      badge: "Advanced"
      title: "Substantive editing"
      desc: "Substantive editing is an advanced level of editing. I will help you turn your results into a clear scientific story, refining the structure, argument, figures, and language so your research reads as clearly as it deserves."
      points:
        pt1: "You’re submitting a thesis, manuscript, or grant proposal, and want the best chance of success"
        pt2: "Your results are solid, but the manuscript still feels unclear or difficult to structure."
        pt3: "You want your paper to tell a compelling scientific story, instead of a collection of disconnected results."
        pt4: "You need a fresh, professional perspective after spending too long inside the same draft."

    copy_editing:
      badge: "Basic"
      title: "Copyediting"
      desc: "Copyediting is a basic level of editing. I will smooth out awkward phrasing, repetition, inconsistencies, and language errors to make your manuscript clearer and easier to read."
      points:
        pt1: "Your thesis, manuscript, or grant proposal is nearly there and only needs final refinements before submission."
        pt2: "Your ideas and results are well organized but need polishing for clarity and flow."
        pt3: "You want the language to remain concise, coherent, and consistent throughout the manuscript."
        pt4: "You need the document formatted according to journal or university guidelines."

    manuscript_eval:
      title: "Manuscript evaluation"
      desc: "A manuscript evaluation is a detailed editorial review of your manuscript. I will read through the draft carefully and provide actionable feedback on the scientific narrative, structure, clarity, language, and overall flow of the paper."
      points:
        pt1: "You want to better understand the strengths and weaknesses of your draft."
        pt2: "You want detailed feedback before revising the manuscript yourself with confidence."
        pt3: "You need a fresh pair of eyes to review the manuscript in depth."
        pt4: "You want to maximize the chances of success for your manuscript or grant proposal."

    figure_design:
      title: "Figure Design"
      desc: "Scientific figures are often the first thing readers look at. Clear, thoughtful visuals can make complex results easier to understand, strengthen your scientific story, and increase the overall impact of your work. I will redesign your figures so readers can understand your results quickly and intuitively."
      points:
        pt1: "You want your figures to communicate your results more clearly and effectively."
        pt2: "Your visuals feel cluttered, inconsistent, or difficult to interpret."
        pt3: "You need help improving layout, labeling, color choices, or overall visual flow."
        pt4: "You want publication-ready figures for a manuscript, thesis, grant proposal, or presentation."

  workflow:
    heading: "How we’ll work together:"
    step1:
      title: "Contact me"
      desc: "Share your project and your struggles."
    step2:
      title: "Approve the quote"
      desc: "Know the exact price and the plan tailored to your needs and calendar."
    step3:
      title: "Relax and Wait"
      desc: "Take time off to disconnect. I’ll polish your manuscript and deliver by the agreed deadline."

  faq:
    heading: "Frequently Asked Questions"
    q1: "How much do your services cost?"
    a1: "Every project is different, and pricing depends on the scope of the work, timeline, and level of support required. I always provide clear estimates upfront and am happy to discuss different options to find the approach that best fits your needs and budget."
    q2: "Do you offer student discounts?"
    a2: "I understand that students often work with limited funding. Whenever possible, I try to offer flexible solutions and adapt the scope of work to fit different budgets. Feel free to contact me to discuss your project and see what might be possible."
    q3: "How quickly do you review projects?"
    a3_p1: "I typically return projects within two weeks, though many are completed earlier. If a longer turnaround is necessary, I will always let you know beforehand and discuss the timeline with you directly."
    a3_p2: "If you are working under a tight deadline, please reach out as soon as possible. I will always try to accommodate urgent requests whenever possible. Additional rush fees may apply."
    q4: "What type of documents do you review?"
    a4_intro: "I provide scientific writing support and feedback for a range of research-related documents, including:"
    q5: "Will you review my project more than once?"
    a5: "Additional rounds of review can always be arranged depending on your needs. We can discuss the best approach before starting the project. Additional fees may apply."

  testimonials:
    heading: "What clients say"
    t1:
      quote: "With Camille's help, I went from being insecure about writing to genuinely enjoying it. At my current job as a researcher, I write many proposals and reports; my team lead was so impressed by my first report that he immediately alerted the director to my writing skills. Without Camille, I daresay that would not have happened! I would highly recommend Camille as a writing coach."
      name: "N.T. - Entomology Researcher"
    t3:
      quote: "Camille was very helpful. Even though my paper was outside his field, he provided valuable feedback and thoughtful suggestions."
      name: "R.D. - grad student at UNC Chapel Hill"
    t2:
      quote: "Having worked closely with Dr. Camille Le Roy for several years, I can confidently say he is both an outstanding scientist and an exceptionally skilled writer. Camille is patient, organized, and deeply supportive—qualities that make him a highly effective and trustworthy academic mentor. He has a systematic mindset and a deep understanding of how to structure scientific arguments and communicate complex ideas with absolute clarity. For anyone seeking expert guidance in academic writing, Camille is strongly recommended."
      name: "F.M. - Researcher at Wageningen University"

  about:
    heading: "About Me"
    name: "Camille Le Roy, PhD"
    intro: "I’m Camille. I am a research scientist, a field biologist, and a biomechanicist — but above all, I am a writer who understands the challenges researchers face."
    details_1: "With a PhD in Evolutionary Biology from the University of Paris and over seven years of interdisciplinary research spanning Ecology and Biophysics, my journey has taken me from the cloud forests of Peru to labs in France and the Netherlands. Along the way, I came to realize a shared struggle among researchers: we excel at the 'doing' the experiments, the models, the field expeditions, but we often struggle to hit the 'stop button' and immerse ourselves in the writing."
    details_2: "I’ve been on that road. I know that turning years of messy data into a compelling story is a long, eventful adventure. Having authored 8 first-author papers in top-tier journals (including <em>Science</em> and <em>Nature Communications</em>) and served as a reviewer for 12+ multidisciplinary journals, I’ve learned how to bridge the gap between raw results and impactful publication."
    conclusion: "Today, I dedicate my expertise to helping fellow scholars transform their research into narratives that truly do justice to their discoveries."

  contact:
    heading: "Reach Out"
    success_title: "Thank you!"
    success_msg: "Your message has been sent. I will get back to you shortly."
    error_msg: "Oops! There was a problem submitting your form. Please try again."
    name_placeholder: "Your Name *"
    email_placeholder: "Your Email *"
    referral_placeholder: "How did you hear about me? *"
    message_placeholder: "Your Message *"
    submit_btn: "Send Message"

  about_name:
    heading: "Why 'Morpho'?"
    text: "During my academic journey, I studied the evolution of morphology and flight biomechanics in insects, particularly the iconic <em>Morpho</em> butterflies of the Amazon rainforest. My editing business takes its name from them."

fr:
  nav:
    services: "Services"
    about: "À propos"
    testimonials: "Témoignages"
    contact: "Contact"

  header:
    heading_part1: "Vous avez fait<br>le plus dur"
    heading_part2: "Publier ne devrait pas<br>être l'étape qui vous achève"
    lead_in: "Coaching et révisions pour les jeunes chercheurs en quête d'un accompagnement régulier, de retours personnalisés et<br>d'un chemin clair pour transformer des données brutes en articles publiés"
    schedule_btn: "Book un appel gratuit"
    btn: "Envoyez-moi un message"

  empathy:
    headline: "Vous avez passé des mois au labo ou sur le terrain, à mener des expériences et déboguer des analyses. Chaque donnée a demandé du temps, des efforts, et de la sueur. Vous avez <em>mérité</em> vos résultats."
    subheadline: "La partie la plus difficile n’est plus la science. C’est de structurer votre travail en un récit clair et publiable."
    text_1: "La recherche est chaotique par nature : itérative, non linéaire, pleine d’impasses et de détours inattendus. Pourtant, les articles scientifiques sont censés se lire comme une histoire parfaitement construite. <strong style='color: #333;'>Raconter cette histoire est un vrai défi, et cela n’a rien à voir avec la qualité de votre science.</strong>"
    text_3: "Le temps des directeurs de thèse est souvent partagé entre de nombreuses responsabilités. En conséquence, l'essentiel du doctorat se déroule entre les réunions, vous laissant gérer l'incertitude seul et tenter de décider où consacrer au mieux votre temps et votre énergie."
    text_4: "Perdre sa motivation et son enthousiasme pour ses propres recherches est fréquent durant un doctorat. Se sentir constamment en retard, bloquer sur le même brouillon pendant des semaines et porter le poids de l'incertitude ne devrait pas être le prix à payer pour devenir chercheur."
    text_5: "Je suis passé par là. Je sais ce que c'est d'avoir des résultats solides mais un manuscrit qui ne le reflète pas. Un récit qui s'éparpille dans cinq directions différentes. Des nuits passées à fixer mon propre brouillon en me demandant ce que l'article essayait même de raconter."
    text_6: "Après des années passées à transformer des projets de recherche en publications et à aider des étudiants à faire de même, je sais à quel point ce parcours peut être difficile, et à quel point il devient plus facile avec le bon accompagnement."
    text_7: "Et si vous pouviez soumettre d'ici quelques mois,<br>et ressentir le soulagement de passer à votre prochain projet, bien plus stimulant ?"
    list_title: "Ce que vous pouvez attendre de notre collaboration :"
    bullet_1: "<strong>Un confrère scientifique qui parle votre langage.</strong> J’ai fait de la recherche, collecté des données, révisé et publié — je sais à quel point publier un article peut être difficile du début à la fin."
    bullet_2: "<strong>Aucun jugement.</strong> Un brouillon n'est jamais trop brouillon, et aucune question n'est trop basique. Amenez-moi votre chaos."
    bullet_3: "<strong>Véritablement disponible.</strong> Je ne vais pas disparaître après vous avoir renvoyé les corrections avec suivi des modifications. Que vous ayez besoin d'une refonte complète de votre manuscrit ou simplement de réfléchir à voix haute, je suis là."
    bullet_4: "<strong>Des retours spécifiques à votre travail.</strong> Je prends le temps de comprendre votre recherche, votre argumentaire, et la direction que vous souhaitez prendre. Je ne donne pas de commentaires génériques."
    final_thought: "Un manuscrit ne devrait pas rester pendant encore six mois dans un dossier de brouillons. Vos résultats comptent, et la communauté scientifique ne peut construire que sur des travaux qu'elle peut réellement lire. J’ai créé Morpho Editing parce que la bonne science mérite d’être bien racontée. Assurons-nous que ce soit le cas pour la vôtre."
    get_started_btn: "Découvrir mes services"
  
  coaching:
    heading: "Services de Coaching"
    subheading: "Bénéficiez d'un partenaire de recherche dédié à vos côtés"
    clarity:
      badge: "Ponctuel"
      title: "Session de Clarté Scientifique"
      desc: "Une séance de coaching unique conçue pour vous aider à surmonter un blocage précis. Que vous soyez coincé sur votre manuscrit, face à une échéance imminente ou que vous ayez simplement besoin de clarifier vos prochaines étapes, vous repartirez avec des conseils pratiques et un plan d'action clair."
      points:
        pt1: "Une séance individuelle de 60 minutes"
        pt2: "Relecture de vos documents avant la séance"
        pt3: "Un suivi post-séance pour maintenir votre dynamique"
    accelerator:
      badge: "Suivi continu"
      title: "Accélérateur de Publication"
      desc: "Ce programme de coaching continu vous offre un partenaire dédié pour vous aider à créer une dynamique régulière, consolider votre manuscrit et avancer sereinement vers la publication."
      points:
        pt1: "Deux séances de coaching de 60 minutes par mois en ligne"
        pt2: "Relecture de vos brouillons avant chaque séance"
        pt3: "Assistance illimitée par messagerie"
        pt4: "Tarifs préférentiels sur les services de révision"

  services:
    heading: "Services de Révision"
    subheading_main: "Bénéficiez d’un accompagnement adapté à votre manuscrit"
    subheading_evaluation: "Vous êtes bloqué mais souhaitez réviser vous-même ?<br>Obtenez une évaluation de manuscrit"
    subheading_figures: "Vous voulez que vos recherches se démarquent au premier coup d'œil ?<br>Donnez plus d’impact à vos travaux avec des figures prêtes pour la publication"
    subheading_cta: "Vous ne savez pas exactement ce dont vous avez besoin ? Discutons-en"
    checklist_title: "Idéal pour vous si :"
    btn: "Envoyez-moi un message"

    dev_editing:
      badge: "Avancé"
      title: "Révision de fond"
      desc: "La révision de fond correspond à un accompagnement éditorial approfondi. Je vous aide à transformer vos résultats en un récit scientifique clair et cohérent, en travaillant la structure, l’argumentation, les figures et le style afin que votre recherche soit présentée avec toute la clarté qu’elle mérite."
      points:
        pt1: "Vous soumettez une thèse, un manuscrit ou une demande de financement et souhaitez maximiser vos chances de succès."
        pt2: "Vos résultats sont solides, mais le manuscrit vous semble encore flou ou difficile à structurer."
        pt3: "Vous voulez que votre article raconte une histoire scientifique captivante plutôt qu’une suite de résultats déconnectés."
        pt4: "Vous avez besoin d’un regard neuf et professionnel après avoir passé trop de temps sur le même brouillon."

    copy_editing:
      badge: "Essentiel"
      title: "Révision linguistique"
      desc: "La révision linguistique est un niveau de révision plus léger. Je corrigerai les formulations maladroites, les répétitions, les incohérences et les erreurs de langue afin de rendre votre manuscrit plus clair et plus agréable à lire."
      points:
        pt1: "Votre thèse, manuscrit ou demande de subvention est presque finalisé et nécessite seulement les dernières corrections avant soumission."
        pt2: "Vos idées et résultats sont bien organisés mais ont besoin d’être peaufinés pour gagner en clarté et en fluidité."
        pt3: "Vous souhaitez un texte concis, cohérent et homogène dans l’ensemble du manuscrit."
        pt4: "Vous avez besoin d’un document mis en forme selon les directives d’une revue ou d’une université."

    manuscript_eval:
      title: "Évaluation de manuscrit"
      desc: "Une évaluation de manuscrit est une analyse éditoriale détaillée de votre document. Je lirai attentivement votre brouillon et fournirai des feedbacks concrets sur le récit scientifique, la structure, la clarté, la langue et la fluidité globale de l’article."
      points:
        pt1: "Vous souhaitez mieux comprendre les forces et les faiblesses de votre brouillon."
        pt2: "Vous voulez des retours détaillés avant de réviser le manuscrit vous-même en toute confiance."
        pt3: "Vous avez besoin d’un regard neuf pour analyser votre manuscrit en profondeur."
        pt4: "Vous souhaitez maximiser les chances de succès de votre manuscrit ou de votre demande de subvention."

    figure_design:
      title: "Conception de figures"
      desc: "Les figures scientifiques sont souvent la première chose que les lecteurs regardent. Des visuels clairs et réfléchis permettent de mieux comprendre des résultats complexes, renforcent votre récit scientifique et augmentent l’impact global de votre travail. Je repenserai vos figures afin que vos lecteurs comprennent vos résultats rapidement, et clairement."
      points:
        pt1: "Vous souhaitez que vos figures communiquent vos résultats de manière plus claire et plus efficace."
        pt2: "Vos visuels semblent encombrés, incohérents ou difficiles à interpréter."
        pt3: "Vous avez besoin d’aide pour améliorer la mise en page, les légendes, les couleurs ou la fluidité visuelle globale."
        pt4: "Vous souhaitez des figures prêtes pour la publication, une thèse, une demande de financement ou une présentation."

  workflow:
    heading: "Comment je vous accompagne :"
    step1:
      title: "Contactez-moi"
      desc: "Parlez-moi de votre projet et de vos difficultés."
    step2:
      title: "Validez le devis"
      desc: "Un prix clair dès le départ et un planning adapté à vos besoins et à vos échéances."
    step3:
      title: "Détendez-vous"
      desc: "Déconnectez de votre manuscrit. Je m'occupe de l'améliorer et vous le remets pour l'échéance convenue."

  faq:
    heading: "Foire Aux Questions"
    q1: "Combien coûtent les services de révision ?"
    a1: "Chaque projet est unique et le tarif dépend de l'étendue du travail, des délais et du niveau d'accompagnement requis. Je fournis toujours une estimation claire dès le départ et je suis ravi d'échanger sur les différentes options pour trouver la formule qui correspond le mieux à vos besoins et à votre budget."
    q2: "Proposez-vous des tarifs étudiants ?"
    a2: "Je sais que les étudiants disposent souvent de financements limités. Dans la mesure du possible, je m'efforce de proposer des solutions flexibles et d'adapter la nature des travaux à différents budgets. N'hésitez pas à me contacter pour discuter de votre projet."
    q3: "Quel est votre délai de révision ?"
    a3_p1: "Je rends généralement les projets dans un délai de deux semaines, même si beaucoup sont finalisés plus tôt. Si un délai plus long est nécessaire, je vous en informerai systématiquement à l'avance pour en discuter directement avec vous."
    a3_p2: "Si vous travaillez avec des délais très serrés, contactez-moi dès que possible. Je ferai toujours de mon mieux pour m'adapter aux demandes urgentes. Des frais d'urgence supplémentaires peuvent s'appliquer."
    q4: "Quels types de documents révisez-vous ?"
    a4_intro: "Je propose des services de révision et d'aide à la rédaction scientifique pour une large gamme de documents liés à la recherche, notamment :"
    q5: "Allez-vous réviser mon projet plus d'une fois ?"
    a5: "Des sessions de révision supplémentaires peuvent tout à fait être organisées selon vos besoins. Nous pouvons définir ensemble la meilleure approche avant de commencer le projet. Des frais supplémentaires peuvent s'appliquer."

  testimonials:
    heading: "Leur expérience"
    t1:
      quote: "L’accompagnement de Camille m’a permis de passer d’un manque de confiance en mon écriture à un véritable plaisir à écrire. Aujourd’hui, dans mon poste de chercheuse, je rédige régulièrement des rapports et des propositions. Mon responsable a été particulièrement impressionné par mon premier rapport et a mis en avant mes compétences rédactionnelles auprès de la direction. Je recommande vivement Camille."
      name: "N.T. - chercheuse en entomologie"
    t3:
      quote: "Camille m’a été d’une grande aide. Même si mon article était en dehors de son domaine, il m’a apporté des retours précieux et des suggestions très pertinentes."
      name: "R.D. - étudiante à UNC Chapel Hill"
    t2:
      quote: "J'ai travaillé en étroite collaboration avec le Dr Camille Le Roy pendant plusieurs années, et je peux affirmer qu'il est à la fois un scientifique remarquable et un rédacteur exceptionnellement talentueux. Camille est patient, organisé et d'un grand soutien — des qualités qui font de lui un mentor académique particulièrement efficace et digne de confiance. Il possède un esprit systématique et une profonde compréhension de la manière de structurer les arguments scientifiques et de communiquer des idées complexes avec une grande clarté. Pour quiconque recherche un accompagnement expert en rédaction académique, Camille est vivement recommandé."
      name: "F.M. - chercheur à l'Université de Wageningen"

  about:
    heading: "À propos"
    name: "Camille Le Roy, PhD"
    intro: "Je m'appelle Camille. Je suis chercheur, biologiste et biomécanicien — mais surtout, fin connaisseur des exigences de l’écriture académique."
    details_1: "Titulaire d'un doctorat en biologie évolutive de l'Université de Paris et fort de plus de sept ans de recherche interdisciplinaire entre l'écologie et la biophysique, mon parcours m’a mené des forêts amazoniennes du Pérou aux laboratoires en France et aux Pays-Bas. En chemin, j'ai pris conscience d'une difficulté commune à beaucoup de chercheurs : nous excellons dans la 'pratique', les expériences, les modèles, les expéditions de terrain — mais nous avons souvent du mal à nous arrêter pour nous immerger dans l'écriture."
    details_2: "Je suis passé par là. Transformer des années de données complexes en un récit clair et convaincant est un processus exigeant. Avec huit articles en premier auteur dans des revues de premier plan (notamment <em>Science</em> et <em>Nature Communications</em>), ainsi qu’une expérience de relecteur pour une douzaine de revues multidisciplinaires, j’ai appris à transformer des résultats complexes en récits scientifiques clairs et convaincants."
    conclusion: "Aujourd’hui, je mets cette expertise au service des étudiants et des chercheurs pour les aider à franchir ce dernier pas : transformer leur manuscrit en un récit qui rend pleinement justice à leurs découvertes."

  contact:
    heading: "Contactez-moi"
    success_title: "Merci !"
    success_msg: "Votre message a bien été envoyé. Je vous répondrai sous peu."
    error_msg: "Oups ! Il y a eu un problème lors de l'envoi du formulaire. Veuillez réessayer."
    name_placeholder: "Votre nom *"
    email_placeholder: "Votre email *"
    referral_placeholder: "Comment avez-vous entendu parler de moi ? *"
    message_placeholder: "Votre message *"
    submit_btn: "Envoyer le message"

  about_name:
    heading: "Pourquoi 'Morpho' ?"
    text: "Au cours de mes recherches, j’ai étudié l’évolution de la morphologie et la biomécanique du vol chez les insectes, en particulier les emblématiques papillons Morpho de la forêt amazonienne. Mon activité d’édition en tire naturellement son nom."